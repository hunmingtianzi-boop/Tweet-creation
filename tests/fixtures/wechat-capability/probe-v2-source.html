<section data-probe="wechat-svg-smil-v2" style="margin:0;padding:22px;background:#f3f0e7;color:#173a3b;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">

  <p style="margin:0 0 24px;color:#526767;font-size:13px;line-height:1.6;">不依赖 ID；全部交互使用元素自身的 begin=&quot;click&quot;，不含 JavaScript。</p>

  <h2 style="margin:0 0 8px;font-size:18px;">C · 自触发颜色与运动</h2>

    <line x1="38" y1="44" x2="306" y2="44" stroke="#c5d8cc" stroke-width="4"/>
    <circle data-probe-target="self-motion-dot" cx="46" cy="44" r="19" fill="#f1c85b" style="cursor:pointer;">
      <set attributeName="fill" to="#ea7660" begin="click" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;250 0;0 0" dur="1.4s" begin="click" repeatCount="1"/>

    <text x="38" y="98" fill="#526767" font-size="12">预期：变为珊瑚色并往返一次</text>
