name: workflow-gates

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-contracts:
    name: Portable contracts / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile every Python entrypoint
        run: >-
          python -c "import pathlib, py_compile;
          [py_compile.compile(str(path), doraise=True)
          for path in pathlib.Path('scripts').glob('*.py')]"
      - name: Verify portable and fail-closed contracts
        run: >-
          python -m unittest -v
          tests.test_platform_support_contract
          tests.test_release_skills
          tests.test_download_ingestion
          tests.test_workflow_attribution
          tests.test_interaction_mvp
          tests.test_cutout_gate
          tests.test_prepare_micro_cutout
      - name: Verify deterministic Skill release manifest
        run: python -I -S scripts/release_skills.py verify release/org-wechat-skills-v1.json
