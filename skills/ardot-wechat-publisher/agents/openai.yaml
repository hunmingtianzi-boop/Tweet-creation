interface:
  display_name: "Ardot WeChat Publisher"
  short_description: "Send reviewed Ardot articles to WeChat"
  brand_color: "#07C160"
  default_prompt: "Use $ardot-wechat-publisher, pass the delivery binding gate and fresh host probes for the current Ardot root and visible target account, then save, reopen, and verify the draft with an explicit current-session or portable-signed assurance label; publish only with portable signed audit and my fresh confirmation."
dependencies:
  tools:
    - type: "mcp"
      value: "ardot-remote"
      description: "Freeze and export the current reviewed Ardot root before WeChat delivery"
      transport: "streamable_http"
      url: "https://ardot.tencent.com/mcp"
policy:
  allow_implicit_invocation: true
