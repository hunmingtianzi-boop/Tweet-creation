  short_description: "Generate and validate source images through ChatGPT web"
  default_prompt: "Use $chatgpt-web-image-route; when this is a workflow migration, first run the report-bound native-alpha-first neutral RGBA route probe. Otherwise ask ChatGPT web for genuine native transparency first, download the original, and validate or normalize it as a true RGBA8 cutout; use one controlled-key fallback only after strict Alpha/pixel-gate failure."
