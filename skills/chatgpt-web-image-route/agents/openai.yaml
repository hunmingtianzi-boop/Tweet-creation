interface:
  display_name: "ChatGPT Web Image Route"
  short_description: "Generate and validate source images through ChatGPT web"
  default_prompt: "Use $chatgpt-web-image-route; when this is a workflow migration, first run the report-bound native-alpha-first neutral RGBA route probe. Ask ChatGPT web for genuine native transparency first, download the provider original, ingest the Browser-observed absolute path with the create-once local ingestor, and validate or normalize the exact ingested bytes as a true RGBA8 cutout; use one controlled-key fallback only after strict Alpha/pixel-gate failure. For every formal article derivative require org-wechat-provider-image-acquisition-v2 and revalidate the completed same-session migration, canonical request, create-once ingestion, exact raw bytes, and RGBA pixel chain. Current-session acceptance is operator/harness-trusted with host_attested=false and portable=false; an optional Python hook may veto but cannot upgrade assurance. Only protected Ed25519 migration and provider receipts create portable assurance. Do not claim the local ingestion report is a signed Browser event."
policy:
  allow_implicit_invocation: true
