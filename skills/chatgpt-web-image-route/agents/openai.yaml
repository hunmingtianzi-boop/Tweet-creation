interface:
  display_name: "ChatGPT Web Image Route"
  short_description: "Codex-only ChatGPT web image generation and RGBA validation"
  default_prompt: "Use $chatgpt-web-image-route on Codex Desktop only. Before opening ChatGPT, declare and verify the external $codex-with-chatgpt Skill/built checkout, exact-workspace connection, built-in Browser route and current ChatGPT login; stop outside Codex or on a mismatched/unready connection. Do not run or require a synthetic RGBA migration probe: bind the runtime/provider session and let the first real article asset provide quality evidence. Require the already confirmed production_preferences before generation: micro_component_count is 0..4, selected_roles must match that count, style_route supplies the approved article style, generate_backgrounds decides whether background assets are requested, and use_svg remains an authoring choice rather than a reason to invent image slots. Generate only those selected article-specific slots. For each transparent micro slot, choose the source mode before generation: either request genuine native transparency or request a planned, safely separable controlled-key solid background; controlled-key may be the first attempt and does not require a fabricated native-alpha failure. Download the provider original, ingest the Browser-observed absolute path with the create-once local ingestor, and derive the exact ingested bytes. Regardless of source mode, do not register or place the result until the final subject-only derivative is true-transparent RGBA8 and passes robust Alpha, tight-crop, open-edge, matte, halo, debris, and multi-background pixel checks. For every formal article derivative require org-wechat-provider-image-acquisition-v2 and revalidate the same-session runtime binding, canonical request, create-once ingestion, exact raw bytes, and per-asset quality chain. Current-session acceptance is operator/harness-trusted with host_attested=false and portable=false; an optional Python hook may veto but cannot upgrade assurance. Do not claim the local ingestion report is a signed Browser event."
policy:
  allow_implicit_invocation: true
