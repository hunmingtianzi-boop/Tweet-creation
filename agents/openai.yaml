interface:
  display_name: "Organization WeChat Studio"
  short_description: "Build source-zero Ardot WeChat articles with safe interaction"
  brand_color: "#1648C8"
  default_prompt: "Use $org-wechat-studio, run the migration-stage native-alpha-first neutral RGBA route probe before reading organization material, pass the target binding and current host probes, then use $chatgpt-web-image-route to request genuine transparent originals first and one controlled-key fallback only after strict Alpha/pixel-gate failure while building a source-zero organization pack, 2–3 semantic interaction modules, and an Ardot-native WeChat article with verified-draft delivery."
dependencies:
  tools:
    - type: "mcp"
      value: "ardot-remote"
      description: "Read, edit, and export the current Ardot-native article and component nodes"
      transport: "streamable_http"
      url: "https://ardot.tencent.com/mcp"
policy:
  allow_implicit_invocation: true
