interface:
  display_name: "Organization WeChat Studio"
  short_description: "Build source-zero Ardot WeChat articles with safe interaction"
  brand_color: "#1648C8"
  default_prompt: "Use $org-wechat-studio. Before reading organization material, audit the locked platform, build a verified host-registry census from the installed release, generate the runtime profile from the compact target, and complete the native-alpha-first migration probe. On Codex Desktop, use the current-session Browser trace plus create-once download ingestion; request portable signed migration or a host filesystem lease only when those host callables actually exist. For every formal generated article asset require org-wechat-provider-image-acquisition-v2 and revalidate the completed same-session migration, canonical request, create-once ingestion, exact raw bytes, and RGBA pixel chain. Record current-session acceptance as operator/harness-trusted with host_attested=false and portable=false. An optional Python policy hook may veto but never upgrades assurance; only the protected Ed25519 migration plus provider receipts make a portable claim. Then use $chatgpt-web-image-route for genuine transparent originals first and one controlled-key fallback only after strict Alpha/pixel-gate failure while building a source-zero organization pack, 2–3 semantic interaction modules, and an Ardot-native WeChat article with verified delivery."
dependencies:
  tools:
    - type: "mcp"
      value: "ardot-remote"
      description: "Read, edit, and export the current Ardot-native article and component nodes"
      transport: "streamable_http"
      url: "https://ardot.tencent.com/mcp"
policy:
  allow_implicit_invocation: true
