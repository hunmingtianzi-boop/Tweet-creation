interface:
  display_name: "Organization WeChat Studio"
  short_description: "Codex-only source-zero Ardot WeChat authoring and delivery"
  brand_color: "#1648C8"
  default_prompt: "Use $org-wechat-studio. First declare that this executable release supports Codex Desktop only, read the clone/host prerequisites, and stop before source material unless the same-release workflow Skills, external $codex-with-chatgpt checkout/workspace connection, phase-required ChatGPT built-in-Browser login, Ardot Remote login and exact file/root permission, and delivery-stage WeChat account route are prepared. Ask one grouped startup question for micro-component count 0–4, whether to use SVG interactions, the style route, and whether to generate raster background images; do not silently choose defaults, and record the confirmed answer in article.production_preferences. Then audit the locked platform, build the Codex current-session census from the installed release, generate the runtime profile from the compact target, and bind the runtime/provider session without generating an RGBA migration probe. Use the current-session Browser trace plus create-once download ingestion for real article assets. For every selected formal article component require org-wechat-provider-image-acquisition-v2 and revalidate the same-session runtime binding, canonical request, create-once ingestion, exact raw bytes, derivation, and strict final RGBA8 cutout quality chain. The raw original may use native Alpha or a planned controlled-key source; never let that flexibility bypass final transparency checks. Record current-session acceptance as operator/harness-trusted with host_attested=false and portable=false. An optional Python policy hook may veto but never upgrades assurance. Then build a source-zero organization pack and an Ardot-native WeChat article using exactly the confirmed component, SVG, style and background choices, with verified delivery."
dependencies:
  tools:
    - type: "mcp"
      value: "ardot-remote"
      description: "Read, edit, and export the current Ardot-native article and component nodes"
      transport: "streamable_http"
      url: "https://ardot.tencent.com/mcp"
policy:
  allow_implicit_invocation: true
